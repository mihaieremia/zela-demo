[workspace]
members = ["block_time","hello_world", "priority_fees"]
resolver = "3"

[workspace.dependencies]
zela-std = { git = "https://github.com/mihaieremia/zela-std.git", branch = "feat/cleanup-build-optimizations" }
serde = { version = "1.0.228", features = ["derive"] }
log = { version = "0.4" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
